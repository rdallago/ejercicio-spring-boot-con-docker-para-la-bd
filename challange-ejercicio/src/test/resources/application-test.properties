    # Configuraci\u00c3\u00b3n para la base de datos PostgreSQL de test
    spring.datasource.url=jdbc:postgresql://localhost:5432/challange_db_test
    spring.datasource.username=postgres
    spring.datasource.password=root
    spring.datasource.driver-class-name=org.postgresql.Driver

    # Configuraci\u00c3\u00b3n JPA / Hibernate
    spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
    spring.jpa.hibernate.ddl-auto=validate
    spring.jpa.show-sql=true

    # Deshabilitar inicializaci\u00c3\u00b3n autom\u00c3\u00a1tica de scripts SQL
    spring.sql.init.mode=never