version: 2.1

executors:
  java-executor:
    docker:
      - image: cimg/openjdk:17.0
    working_directory: ~/project/challange-ejercicio

jobs:
  build-and-test:
    executor: java-executor
    steps:
      - checkout:
          path: ~/project

      # Restaura dependencias almacenadas en caché
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-

      # Otorga permisos de ejecución al Maven Wrapper y descarga dependencias
      - run:
          name: Preparar entorno y dependencias
          command: |
            chmod +x mvnw
            ./mvnw dependency:go-offline

      # Guarda las dependencias en caché
      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}

      # Ejecuta tests, genera reporte JaCoCo y envía a Coveralls
      - run:
          name: Ejecutar Pruebas Automatizadas y Subir a Coveralls
          command: |
            ./mvnw clean test jacoco:report coveralls:report

      # Almacena los resultados de los tests
      - store_test_results:
          path: target/surefire-reports

workflows:
  pipeline-integracion-continua:
    jobs:
      - build-and-test